<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkItem Navigator</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/7510/7510794.png">
    <style>
        :root {
            --primary: #2962ff;
            --secondary: #00c853;
            --error: #d32f2f;
            --background: #f8f9fa;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 480px;
            text-align: center;
        }

        .title {
            margin-bottom: 2rem;
            font-size: 1.75rem;
            color: var(--primary);
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-field {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.2);
            outline: none;
        }

        .input-field::placeholder {
            color: #bdbdbd;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .button-primary {
            background: var(--primary);
            color: white;
        }

        .button-primary:hover {
            background: #1565c0;
            transform: translateY(-1px);
        }

        .button-secondary {
            background: var(--secondary);
            color: white;
            margin-top: 1.5rem;
        }

        .button-secondary:hover {
            background: #009624;
            transform: translateY(-1px);
        }

        .error-message {
            color: var(--error);
            margin-top: 0.5rem;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">WorkItem Navigator</h1>
        
        <div class="input-group">
            <input 
                type="number" 
                id="workitemID" 
                class="input-field"
                placeholder="Enter WorkItem ID (e.g., 12345)"
                autofocus
                autocomplete="off"
            >
            <div id="errorMessage" class="error-message">Please enter a valid WorkItem ID</div>
        </div>

        <button onclick="redirect()" class="button button-primary">
            Open WorkItem
        </button>

        <a 
            href="http://172.30.0.12:8080/tfs/web/UI/Pages/WorkItems/QueryResult.aspx?path=Vanrise%2FMy%20Queries%2FAssigned%20To%20me&pguid=81f5a887-a9da-41fc-8c45-50b4cb40e1ea"
            class="button button-secondary"
        >
            My WorkItems
        </a>
    </div>

    <script>
        function redirect() {
            const input = document.getElementById('workitemID');
            const error = document.getElementById('errorMessage');
            const workitemID = input.value.trim();

            if (!workitemID) {
                input.focus();
                error.classList.add('show');
                return;
            }

            error.classList.remove('show');
            window.location.href = `http://172.30.0.12:8080/tfs/web/wi.aspx?id=${workitemID}`;
        }

        // Event Listeners
        document.getElementById('workitemID').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            document.getElementById('errorMessage').classList.remove('show');
        });

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') redirect();
        });

        // Maintain focus on input
        document.getElementById('workitemID').addEventListener('blur', function() {
            setTimeout(() => this.focus(), 10);
        });
    </script>
</body>
</html>
